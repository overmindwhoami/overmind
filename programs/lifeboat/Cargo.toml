[package]
name = "lifeboat"
description = "The Overmind's lifeboat tickets: a Winternitz (hash-based, quantum-resistant) lamports vault, with the WOTS checksum. Fork of Dean Little's solana-winternitz-vault (MIT). Unaudited: test networks only."
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
arrayref = "0.3.9"
pinocchio = "0.7.0"
pinocchio-system = "0.2.1"
solana-nostd-sha256 = "0.1.3"
solana-nostd-keccak = "0.1.3"
